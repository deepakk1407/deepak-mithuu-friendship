
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mithuu × Deepak ❤️</title>
  <link rel="stylesheet" href="style.css"> <link rel="stylesheet" href="animation.css">
</head>
<body>
  <main class="container">
    <h1>🐼 Mithuu × Deepak ❤️</h1>
    <p class="subtitle">Our Little Universe ♾️</p>

    <section id="login-section">
      <h2>Welcome, Bestie! 💗</h2>
      <p>Login pannitu namma friendship world-kulla vaa.</p>

      <input id="name" type="text" placeholder="Your name (Deepak / Mithra)">
      <input id="email" type="email" placeholder="Email address">
      <input id="password" type="password" placeholder="Password">

      <button id="login-btn">Login 💕</button>
      <button id="signup-btn" class="secondary">Create Account ✨</button>

      <p id="auth-message" role="status"></p>
    </section>

    <section id="game-section" hidden>
      <h2 id="welcome"></h2>
      <p id="question"></p>
      <textarea id="answer" placeholder="Un answer inga type pannu..."></textarea>
      <button id="submit-answer">Submit Answer 💌</button>
      <p id="game-message" role="status"></p>

      <h2>💬 Bestie Live Chat</h2>
      <div id="chat-messages"></div>
      <div class="chat-row">
        <input id="chat-input" placeholder="Message type pannu...">
        <button id="send-btn">Send</button>
      </div>
      <button id="logout-btn" class="secondary">Logout</button>
    </section>
  </main>

  <script type="module" src="script.js"></script>
<script src="animation.js"></script>
</body>
</html>
